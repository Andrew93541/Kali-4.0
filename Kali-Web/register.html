<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALI — Create Account</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { overflow-x: hidden; }

    /* ── Animated background orbs ── */
    .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0;
      animation: orb-pulse 6s ease-in-out infinite;
    }
    .orb-1 { width:500px;height:500px; background:radial-gradient(circle,rgba(255,45,138,0.18) 0%,transparent 70%); top:-100px;left:-100px; animation-delay:0s; }
    .orb-2 { width:400px;height:400px; background:radial-gradient(circle,rgba(0,242,254,0.15) 0%,transparent 70%); bottom:-80px;right:-80px; animation-delay:3s; }
    @keyframes orb-pulse { 0%,100%{opacity:0;transform:scale(1)} 50%{opacity:1;transform:scale(1.12)} }

    /* ── Layout ── */
    .register-wrap {
      display: flex; align-items: flex-start; justify-content: center;
      min-height: 100vh; padding: 32px 24px;
      position: relative; z-index: 1;
    }
    .register-box {
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      padding: 40px 40px 36px;
      border-radius: var(--radius-lg);
      width: 100%; max-width: 500px;
      position: relative;
    }
    .register-box::before {
      content:'';position:absolute;top:-1px;left:30px;right:30px;height:2px;
      background:linear-gradient(90deg,transparent,var(--accent-pink),var(--accent-blue),transparent);
    }

    /* ── Brand header ── */
    .reg-header { text-align:center; margin-bottom:30px; }
    .reg-header .shield { font-size:2.2rem; display:block; margin-bottom:8px; filter:drop-shadow(0 0 12px rgba(255,45,138,0.6)); }
    .reg-header h1 {
      font-family:var(--font-display); font-size:2rem; font-weight:800;
      letter-spacing:4px;
      background:linear-gradient(135deg,var(--accent-pink),var(--accent-blue));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .reg-header p { color:var(--text-secondary); font-size:0.85rem; margin-top:4px; }

    /* ── Float label ── */
    .float-group { position:relative; margin-bottom:20px; }
    .float-group input, .float-group select {
      width:100%; padding:18px 14px 8px 16px;
      background:rgba(0,0,0,0.35); border:1px solid var(--glass-border);
      border-radius:var(--radius-md); color:var(--text-primary);
      font-size:0.95rem; font-family:var(--font-sans); outline:none;
      transition:border-color 0.25s, box-shadow 0.25s, background 0.25s;
      -webkit-appearance:none;
    }
    .float-group input:focus, .float-group select:focus {
      border-color:var(--accent-pink); box-shadow:0 0 0 3px rgba(255,45,138,0.15);
      background:rgba(0,0,0,0.5);
    }
    .float-group label {
      position:absolute; left:16px; top:50%; transform:translateY(-50%);
      font-size:0.92rem; color:var(--text-muted); pointer-events:none;
      transition:all 0.2s ease; letter-spacing:0.3px;
    }
    .float-group input:focus + label,
    .float-group input:not(:placeholder-shown) + label {
      top:10px; transform:none; font-size:0.7rem;
      color:var(--accent-pink); letter-spacing:0.8px;
      font-weight:700; text-transform:uppercase;
    }
    .float-group .icon-right {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; font-size:1rem;
      color:var(--text-muted); transition:color 0.2s;
    }
    .float-group .icon-right:hover { color:var(--accent-pink); }

    /* phone prefix */
    .phone-row { display:flex; gap:10px; }
    .phone-prefix {
      width:64px; flex-shrink:0;
      padding:18px 8px 8px 10px;
      background:rgba(0,0,0,0.35); border:1px solid var(--glass-border);
      border-radius:var(--radius-md); color:var(--text-muted);
      font-size:0.9rem; text-align:center;
      display:flex; align-items:center; justify-content:center;
      font-weight:600;
    }
    .phone-row .float-group { flex:1; margin-bottom:0; }

    /* ── Password strength ── */
    .strength-bar {
      height:4px; border-radius:2px; margin-top:8px;
      background:rgba(255,255,255,0.08);
      overflow:hidden;
    }
    .strength-fill {
      height:100%; border-radius:2px; width:0%;
      transition:width 0.4s ease, background 0.4s ease;
    }
    .strength-label {
      font-size:0.72rem; color:var(--text-muted);
      margin-top:4px; text-align:right; letter-spacing:0.5px;
    }

    /* ── Role cards ── */
    .role-section h3 {
      font-family:var(--font-display); font-size:0.78rem; font-weight:700;
      color:var(--text-muted); letter-spacing:1.5px; text-transform:uppercase;
      margin-bottom:12px;
    }
    .role-cards {
      display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
      margin-bottom:24px;
    }
    .role-card {
      background:rgba(0,0,0,0.25); border:1.5px solid var(--glass-border);
      border-radius:var(--radius-md); padding:14px 10px;
      cursor:pointer; text-align:center;
      transition:all 0.25s ease;
      position:relative; overflow:hidden;
    }
    .role-card:hover {
      border-color:rgba(255,45,138,0.35);
      background:rgba(255,45,138,0.06);
    }
    .role-card.selected {
      border-color:var(--accent-pink);
      background:rgba(255,45,138,0.12);
      box-shadow:0 0 16px rgba(255,45,138,0.2);
    }
    .role-card input[type="radio"] { display:none; }
    .role-card .role-icon { font-size:1.8rem; display:block; margin-bottom:8px; }
    .role-card .role-name {
      font-family:var(--font-display); font-size:0.82rem; font-weight:700;
      color:#fff; display:block; margin-bottom:4px;
    }
    .role-card .role-desc {
      font-size:0.7rem; color:var(--text-muted); line-height:1.4;
    }
    .role-card.selected .role-name { color:var(--accent-pink); }
    .role-check {
      position:absolute; top:8px; right:8px;
      width:18px; height:18px; border-radius:50%;
      border:1.5px solid var(--glass-border);
      display:flex; align-items:center; justify-content:center;
      font-size:0.7rem;
    }
    .role-card.selected .role-check {
      background:var(--accent-pink); border-color:var(--accent-pink);
    }

    /* ── Submit ── */
    .btn-register {
      width:100%; padding:15px;
      background:linear-gradient(135deg,var(--accent-pink),var(--accent-blue));
      color:#fff; border:none; border-radius:var(--radius-md);
      font-family:var(--font-display); font-size:1rem; font-weight:700;
      letter-spacing:1px; cursor:pointer; margin-top:4px;
      box-shadow:0 4px 20px rgba(255,45,138,0.35);
      display:flex; align-items:center; justify-content:center; gap:10px;
      transition:transform 0.2s, box-shadow 0.2s;
    }
    .btn-register:hover:not(:disabled) {
      transform:translateY(-2px); box-shadow:0 8px 28px rgba(255,45,138,0.5);
    }
    .btn-register:disabled { opacity:0.65; cursor:not-allowed; }
    .spinner { width:18px;height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── Error / messages ── */
    .error-msg {
      color:var(--color-danger); font-size:0.83rem; margin-top:12px;
      text-align:center; background:rgba(255,74,74,0.1);
      padding:10px 14px; border-radius:8px;
      border:1px solid rgba(255,74,74,0.25); display:none;
    }
    @keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-7px)} 30%,60%,90%{transform:translateX(7px)} }
    .shake { animation:shake 0.45s ease; }

    .auth-links { text-align:center; margin-top:18px; font-size:0.85rem; color:var(--text-muted); }
    .auth-links a { color:var(--accent-blue); text-decoration:none; font-weight:600; }
    .auth-links a:hover { color:var(--accent-pink); }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="register-wrap">
    <div class="register-box" id="regBox">
      <div class="reg-header">
        <span class="shield">🛡️</span>
        <h1>KALI</h1>
        <p>Create your safety account</p>
      </div>

      <form id="regForm" novalidate autocomplete="off">
        <!-- Full Name -->
        <div class="float-group">
          <input type="text" id="fullname" placeholder=" " required />
          <label for="fullname">Full name</label>
        </div>

        <!-- Email -->
        <div class="float-group">
          <input type="email" id="email" placeholder=" " required />
          <label for="email">Email address</label>
        </div>

        <!-- Phone -->
        <div class="phone-row" style="margin-bottom:20px;">
          <div class="phone-prefix">+91</div>
          <div class="float-group">
            <input type="tel" id="phone" placeholder=" " maxlength="10" pattern="[0-9]{10}" required />
            <label for="phone">Phone number</label>
          </div>
        </div>

        <!-- Password -->
        <div class="float-group">
          <input type="password" id="password" placeholder=" " required />
          <label for="password">Password</label>
          <button type="button" class="icon-right" id="togglePwd">👁️</button>
        </div>
        <div style="margin-top:-14px; margin-bottom:18px;">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel">Password strength</div>
        </div>

        <!-- Confirm Password -->
        <div class="float-group">
          <input type="password" id="confirmPwd" placeholder=" " required />
          <label for="confirmPwd">Confirm password</label>
          <button type="button" class="icon-right" id="toggleConfirm">👁️</button>
        </div>

        <!-- Role selection -->
        <div class="role-section">
          <h3>I am a…</h3>
          <div class="role-cards">
            <label class="role-card" id="card-User" onclick="selectRole('User')">
              <input type="radio" name="role" value="User" />
              <div class="role-check" id="check-User"></div>
              <span class="role-icon">🛡️</span>
              <span class="role-name">User</span>
              <span class="role-desc">I need protection and emergency SOS</span>
            </label>
            <label class="role-card" id="card-Guardian" onclick="selectRole('Guardian')">
              <input type="radio" name="role" value="Guardian" />
              <div class="role-check" id="check-Guardian"></div>
              <span class="role-icon">👨‍👩‍👧</span>
              <span class="role-name">Guardian</span>
              <span class="role-desc">I want to protect someone I love</span>
            </label>
            <label class="role-card" id="card-Admin" onclick="selectRole('Admin')">
              <input type="radio" name="role" value="Admin" />
              <div class="role-check" id="check-Admin"></div>
              <span class="role-icon">👮</span>
              <span class="role-name">Police</span>
              <span class="role-desc">I respond to emergencies</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn-register" id="regBtn">
          <div class="spinner" id="spinner"></div>
          <span id="btnText">Create Account</span>
        </button>
        <div class="error-msg" id="errorMsg"></div>
      </form>

      <div class="auth-links">Already have an account? <a href="login.html">Sign in</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let selectedRole = '';

    function selectRole(role) {
      selectedRole = role;
      ['User','Guardian','Admin'].forEach(r => {
        document.getElementById('card-' + r).classList.toggle('selected', r === role);
        const chk = document.getElementById('check-' + r);
        chk.textContent = r === role ? '✓' : '';
      });
    }

    // Password show/hide
    function makeToggle(inputId, btnId) {
      const inp = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      let vis = false;
      btn.addEventListener('click', () => {
        vis = !vis;
        inp.type = vis ? 'text' : 'password';
        btn.textContent = vis ? '🙈' : '👁️';
      });
    }
    makeToggle('password', 'togglePwd');
    makeToggle('confirmPwd', 'toggleConfirm');

    // Password strength
    document.getElementById('password').addEventListener('input', function() {
      const v = this.value;
      let score = 0;
      if (v.length >= 8)  score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      const fill  = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      const pct   = (score / 4) * 100;
      fill.style.width = pct + '%';
      const colors = ['#ff4a4a','#ff9800','#fdd835','#00e676'];
      const labels = ['Weak','Fair','Good','Strong'];
      fill.style.background  = colors[score - 1] || '#333';
      label.textContent      = score ? labels[score - 1] : 'Password strength';
      label.style.color      = colors[score - 1] || 'var(--text-muted)';
    });

    // Shake helper
    function shakeBox() {
      const box = document.getElementById('regBox');
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent   = '⚠️ ' + msg;
      el.style.display = 'block';
      shakeBox();
    }

    // Form submit
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name     = document.getElementById('fullname').value.trim();
      const email    = document.getElementById('email').value.trim();
      const phone    = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirmPwd').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      // Validation
      if (!name) { showError('Please enter your full name.'); return; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email address.'); return; }
      if (!phone || !/^[0-9]{10}$/.test(phone)) { showError('Please enter a valid 10-digit phone number.'); return; }
      if (!password || password.length < 6) { showError('Password must be at least 6 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }
      if (!selectedRole) { showError('Please select your role.'); return; }

      const btn    = document.getElementById('regBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');

      btn.disabled          = true;
      spinner.style.display = 'block';
      btnText.textContent   = 'Creating account…';

      try {
        const data = await register(name, email, '+91' + phone, password, selectedRole);
        if (data.token || data.message === 'User registered successfully' || data.id || data.userId) {
          location.href = 'login.html?registered=1';
        } else {
          showError(data.message || 'Registration failed. Please try again.');
        }
      } catch (err) {
        showError('Connection failed. Is the server running?');
      } finally {
        btn.disabled          = false;
        spinner.style.display = 'none';
        btnText.textContent   = 'Create Account';
      }
    });
  </script>
</body>
</html>
